</head><body><div class="app"><aside class="side"><div class="brand" id="appBrand">ANGGARAN <span style="color:#54d6d0">2026</span></div><div class="sub">Kontrol Anggaran & Rencana SPJ</div><nav class="nav"><button class="active" data-p="dashboard">▦　Dashboard</button><button data-p="rekening">▤　Data Anggaran</button><button data-p="breakdown">▦　Breakdown Bulanan</button><button data-p="rencana">▣　Rencana SPJ Bulanan</button><button data-p="realisasi">↗　Realisasi Anggaran</button><button data-p="laporan">▥　Rekap Tahunan</button></nav><div class="foot">Design by: <b>yb_wiguna</b> · v42.8.0<br><span id="databaseBadge">Database: DB—</span></div></aside><main class="main"><header class="top"><b id="title">Dashboard Kontrol Anggaran</b><div class="year-tools"><label for="yearSelect">Tahun Anggaran</label><select id="yearSelect" onchange="changeYear(this.value)"><option value="2024" >2024</option><option value="2025" >2025</option><option value="2026" selected>2026</option><option value="2027" >2027</option><option value="2028" >2028</option><option value="2029" >2029</option><option value="2030" >2030</option><option value="2031" >2031</option><option value="2032" >2032</option><option value="2033" >2033</option><option value="2034" >2034</option><option value="2035" >2035</option><option value="2036" >2036</option><option value="2037" >2037</option><option value="2038" >2038</option><option value="2039" >2039</option><option value="2040" >2040</option><option value="2041" >2041</option><option value="2042" >2042</option><option value="2043" >2043</option><option value="2044" >2044</option><option value="2045" >2045</option><option value="2046" >2046</option><option value="2047" >2047</option><option value="2048" >2048</option><option value="2049" >2049</option><option value="2050" >2050</option></select><button class="btn secondary" type="button" onclick="exportDatabase()">Ekspor Database</button><button class="btn secondary" type="button" onclick="document.getElementById('databaseImportFile').click()">Impor Database</button><input id="databaseImportFile" type="file" accept=".json,application/json" style="display:none" onchange="importDatabase(this.files[0])"><small id="yearLabel">TA 2026 · Lokal</small></div></header><section id="view" class="content"></section></main></div>
<div class="modal" id="modal"><div class="dialog"><h2 id="mtitle">Edit Anggaran</h2><div id="mbody"></div><div class="actions"><button class="btn secondary" onclick="closeModal()">Batal</button><button class="btn" id="modalSave" onclick="saveItem()">Simpan</button></div></div></div>
<script>
const seed=[],months=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
localStorage.removeItem('simKontrolAnggaran2026');
let activeYear=Number(localStorage.getItem('simAnggaranActiveYear')||2026),page='dashboard',editing=null,componentTarget=null,componentDraft=[];
function readYearData(y){let saved=localStorage.getItem('simAnggaranData_'+y);if(saved)return JSON.parse(saved);if(y===2026){let legacy=localStorage.getItem('simKontrolAnggaran2026_v8')||localStorage.getItem('simKontrolAnggaran2026_v7');if(legacy)return JSON.parse(legacy)}return []}
let db=readYearData(activeYear);
function readPlanState(kind){try{return JSON.parse(localStorage.getItem('simSPJ_'+kind+'_'+activeYear)||'{}')}catch(e){return {}}}
let spjDeferred=readPlanState('deferred'),spjManual=readPlanState('manual');
function savePlanState(){localStorage.setItem('simSPJ_deferred_'+activeYear,JSON.stringify(spjDeferred));localStorage.setItem('simSPJ_manual_'+activeYear,JSON.stringify(spjManual))}
function spjManualValue(id,m){return spjManual[m]&&Object.prototype.hasOwnProperty.call(spjManual[m],id)?Number(spjManual[m][id])||0:null}
function spjShownValue(x,m){let v=spjManualValue(x.id,m);return v===null?spjMonthlyPlan(x,m):v}
function spjDeferredHas(id,m){return !!(spjDeferred[m]&&spjDeferred[m].includes(id))}
function spjDisplayLabel(x){return `<b>${esc(x.subKegiatan||'Sub Kegiatan belum diisi')}</b><div style="font-weight:700;color:#2452a0;margin-top:3px">${esc(x.aktivitas||x.activity||'Aktivitas belum diisi')}</div><div class="hint" style="margin-top:5px">${esc(x.account||'')}</div>`}
function deferSpj(id,m){if(!spjDeferred[m])spjDeferred[m]=[];if(!spjDeferred[m].includes(id))spjDeferred[m].push(id);savePlanState();renderPlan()}
function openManualSpj(m){
 const options=db.map(x=>({x,label:[x.aktivitas||x.activity||'Tanpa Aktivitas',x.account||'Rekening belum diisi'].filter(Boolean).join(' — ')}));
 document.getElementById('mtitle').textContent='Tambah Rekening Manual — '+months[m];
 document.getElementById('mbody').innerHTML=`<div class="field manual-spj-field"><label for="manualAccount">Aktivitas — Rekening Belanja</label><select id="manualAccount" onchange="updateManualBalance(${m})"><option value="">Pilih aktivitas dan rekening</option>${options.map(o=>`<option value="${o.x.id}">${esc(o.label)}</option>`).join('')}</select></div><div class="note" id="manualBalance">Pilih rekening untuk melihat sisa pagu semester.</div><div class="field manual-spj-field" style="margin-top:14px"><label for="manualAmount">Nominal Rencana SPJ / yang akan direalisasikan</label><input id="manualAmount" type="text" inputmode="numeric" placeholder="Masukkan nominal" oninput="this.value=formatNominal(this.value)"></div><div class="hint" style="margin-top:8px">Nominal tidak boleh melebihi sisa pagu semester rekening terpilih.</div>`;
 document.getElementById('modalSave').textContent='Simpan Rencana';document.getElementById('modalSave').onclick=()=>saveManualSpj(m);
 const modal=document.getElementById('modal');modal.classList.add('open');
}
function updateManualBalance(m){let id=document.getElementById('manualAccount').value,x=db.find(z=>z.id===id),el=document.getElementById('manualBalance');if(!el)return;if(!x){el.textContent='Pilih rekening untuk melihat sisa pagu semester.';return}let remain=spjRemainingPool(x,m),already=spjManualValue(id,m);el.innerHTML=`Sisa pagu semester rekening ini: <b>${money(remain)}</b>${already!==null?`<br>Nominal manual saat ini: <b>${money(already)}</b>`:''}`}
function saveManualSpj(m){let id=document.getElementById('manualAccount').value,x=db.find(z=>z.id===id),amount=parseNominal(document.getElementById('manualAmount').value);if(!x){alert('Pilih rekening belanja terlebih dahulu.');return}if(amount<=0){alert('Masukkan nominal lebih dari nol.');return}let limit=spjRemainingPool(x,m);if(amount>limit){alert('Nominal melebihi sisa pagu semester rekening: '+money(limit));return}if(!spjManual[m])spjManual[m]={};spjManual[m][id]=amount;spjDeferred[m]=(spjDeferred[m]||[]).filter(v=>v!==id);savePlanState();closeModal();renderPlan()}

let structures=JSON.parse(localStorage.getItem('simKontrolAnggaran2026_v9_structures')||'null')||[];

at</h3><button class="btn secondary" onclick="go('rencana')">Lihat rencana</button></div>${monthlyCards()}</div>`}

function budgetTree(query='',levelFilter='all'){
 const norm=s=>String(s||'').trim().replace(/\s+/g,' ').toLocaleLowerCase('id');
 const q=norm(query);
 const matches=(s)=>!q||[s.bidang,s.program,s.kegiatan,s.subKegiatan,s.aktivitas].some(v=>norm(v).includes(q));
 const accountMatches=x=>!q||[x.account,x.keterangan,x.bidang,x.program,x.kegiatan,x.subKegiatan,x.aktivitas,x.activity].some(v=>norm(v).includes(q));
 const structuresView=structures.filter(s=>matches(s)||db.some(x=>x.structureId===s.id&&accountMatches(x)));
 let roots=new Map();
 const getNode=(map,key,label,level)=>{if(!map.has(key))map.set(key,{key,label,level,children:new Map(),accounts:[],structureIds:[]});let n=map.get(key);if(!n.label&&label)n.label=label;return n};
 const attachStructure=s=>{
  let p=getNode(roots,norm(s.program)||'(tanpa program)',s.program||'Tanpa Program','Program');
  let k=getNode(p.children,norm(s.kegiatan)||'(tanpa kegiatan)',s.kegiatan||'Tanpa Kegiatan','Kegiatan');
  let sk=getNode(k.children,norm(s.subKegiatan)||'(tanpa sub kegiatan)',s.subKegiatan||'Tanpa Sub Kegiatan','Sub Kegiatan');
  let a=getNode(sk.children,norm(s.aktivitas)||'(tanpa aktivitas)',s.aktivitas||'Tanpa Aktivitas','Aktivitas');
  if(s.id&&!a.structureIds.includes(s.id))a.structureIds.push(s.id);
 };
 structuresView.forEach(attachStructure);
 // Include records even if their linked structure was removed or is incomplete.
 db.forEach(x=>{
  let linked=structures.find(s=>s.id===x.structureId);
  attachStructure(linked||{id:x.structureId,bidang:x.bidang,program:x.program,kegiatan:x.kegiatan,subKegiatan:x.subKegiatan,aktivitas:x.aktivitas||x.activity});
 });
 db.filter(accountMatches).forEach(x=>{
  let s=structures.find(z=>z.id===x.structureId)||x;
  let p=roots.get(norm(s.program)||'(tanpa program)');if(!p)return;
  let k=p.children.get(norm(s.kegiatan)||'(tanpa kegiatan)');if(!k)return;
  let sk=k.children.get(norm(s.subKegiatan)||'(tanpa sub kegiatan)');if(!sk)return;
  let a=sk.children.get(norm(s.aktivitas||s.activity)||'(tanpa aktivitas)');if(!a)return;
  if(!a.accounts.some(v=>v.id===x.id))a.accounts.push(x);
 });
 const changed=db.some(x=>Number(x.budget||0)!==Number(x.originalBudget??x.budget??0));
 const accountHtml=x=>`<tr class="tree-account"><td><div style="padding-left:58px"><b>${esc(x.account)}</b><div class="hint">${esc(x.keterangan||'')}</div></div></td><td class="num">${Number(x.qty)||0}</td><td>${esc(x.unit||'')}</td><td class="num">${money(x.unitPrice||0)}</td><td class="num">${money(x.originalBudget??x.budget)}</td>${changed?`<td class="num"><b>${money(x.budget)}</b></td>`:''}<td><button class="btn secondary" onclick="editItem('${x.id}')">Ubah</button></td></tr>`;
 const renderNode=(n)=>{
  let children=[...n.children.values()],isActivity=n.level==='Aktivitas';
  let all=[];
  const collect=z=>{if(z.level==='Aktivitas')all.push(...z.accounts);else [...z.children.values()].forEach(collect)};
  collect(n);
  let pure=sum(all.map(x=>x.originalBudget??x.budget));
  let budget=sum(all.map(x=>x.budget));
  if(levelFilter!=='all'&&levelFilter!==n.level)return children.map(renderNode).join('');
  let indent=({Program:0,Kegiatan:18,'Sub Kegiatan':36,Aktivitas:54}[n.level]);
  let row=`<tr class="tree-node tree-${['program','kegiatan','subkegiatan','aktivitas'][n.level]}"><td><div style="display:flex;align-items:center;gap:8px;padding-left:${indent}px"><span class="level-pill">${n.level}</span><b>${esc(n.label)}</b></div></td><td></td><td></td><td></td><td class="num">${money(pure)}</td>${changed?`<td class="num"><b>${money(budget)}</b></td>`:''}<td>${isActivity?`<button class="btn" onclick="editItem('', '${(n.structureIds||[])[0]||''}')">＋ Rekening</button>`:''}</td></tr>`;
  if(isActivity)row+=n.accounts.map(accountHtml).join('');
  else if(levelFilter==='all')row+=children.map(renderNode).join('');
  return row;
 };
 let body=[...roots.values()].map(renderNode).join('');
 if(!body)return `<div style="padding:28px;text-align:center;color:#6b7890">Belum ada struktur nomenklatur. Buat Program, Kegiatan, Sub Kegiatan, dan Aktivitas terlebih dahulu.</div>`;
 return `<div class="tablewrap"><table class="tree-table"><thead><tr><th>Program / Kegiatan / Sub Kegiatan / Aktivitas / Rekening</th><th class="num">Qty</th><th>Satuan</th><th class="num">Harga Satuan</th><th class="num">Pagu Murni</th>${changed?'<th class="num">Pagu Baru</th>':''}<th>Aksi</th></tr></thead><tbody>${body}</tbody></table></div>`;
}

p(v=>`<option value="${esc(v)}">`).join('')}</datalist></div></div><div class="toolbar" style="margin-top:12px"><button class="btn" onclick="saveStructure()">＋ Simpan Struktur</button><select id="structurePicker" onchange="loadStructure(this.value);showStructurePreview(this.value,'structurePreview')" style="min-width:260px;max-width:100%;flex:1"><option value="">Pilih struktur tersimpan untuk ditinjau</option>${structures.map(z=>`<option value="${z.id}">${esc(z.aktivitas||'Tanpa Aktivitas')}</option>`).join('')}</select><button class="btn secondary" onclick="deleteStructure()">Hapus Struktur Terpilih</button></div><div id="structurePreview" class="note" style="display:none;margin-top:10px"></div></div><div class="panel"><div class="head"><div class="toolbar"><select id="treeLevel" onchange="filterRows()" style="min-width:190px"><option value="all">Semua Tingkatan</option><option value="Program">Program</option><option value="Kegiatan">Kegiatan</option><option value="Sub Kegiatan">Sub Kegiatan</option><option value="Aktivitas">Aktivitas</option></select><input class="search" id="q" placeholder="Cari nama atau rekening..." oninput="filterRows()"><span class="tag">${db.length} rekening</span></div><div class="toolbar"><input id="importFile" type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="importBudgetFile(this.files[0])"><button class="btn secondary" onclick="document.getElementById('importFile').click()">⬆ Impor Data Excel</button><button class="btn secondary" onclick="downloadImportTemplate()">Unduh Template Impor</button><button class="btn secondary" onclick="changeBudget()">＋ Tambah / Ubah Pagu</button></div></div><div class="note">Tampilan berjenjang: Program → Kegiatan → Sub Kegiatan → Aktivitas. Baris tingkat atas hanya menampilkan total pagu rekening turunannya. Tombol + Rekening tersedia pada setiap Aktivitas.</div><div id="tbl">${budgetTree()}</div></div>`}

function changeBudget(){
 let opts=db.map(x=>`<option value="${x.id}">${esc(x.account)} — ${esc(x.activity)}</option>`).join('');
 document.getElementById('mtitle').textContent='Tambah / Ubah Pagu Rekening';
 document.getElementById('mbody').innerHTML=`<div class="formgrid"><div class="field" style="grid-column:1/-1"><label>Pilih rekening</label><select id="budgetAccount" style="width:100%">${opts}</select></div><div class="field"><label>Pagu Murni</label><div id="pureDisplay" style="padding:10px 0;font-weight:700"></div></div><div class="field"><label>Pagu Baru — total setelah perubahan (Rp)</label><input id="newBudgetValue" class="money-input" inputmode="numeric" type="text"></div><div class="field" style="grid-column:1/-1"><div id="budgetDeltaInfo" class="note"></div></div></div>`;
 let refresh=()=>{let x=db.find(z=>z.id===document.getElementById('budgetAccount').value);document.getElementById('pureDisplay').textContent=money(x?.originalBudget??x?.budget??0);document.getElementById('newBudgetValue').value=formatNominal(x?.budget??0);showDelta()};
 let showDelta=()=>{let x=db.find(z=>z.id===document.getElementById('budgetAccount').value),v=parseNominal(document.getElementById('newBudgetValue').value),d=v-(x?.originalBudget??x?.budget??0);document.getElementById('budgetDeltaInfo').innerHTML=`Selisih terhadap Pagu Murni: <b>${d>0?'+':''}${money(d)}</b> (${d>0?'penambahan':d<0?'pengurangan':'tidak berubah'})`};
 document.getElementById('budgetAccount').onchange=refresh;document.getElementById('newBudgetValue').oninput=showDelta;
 document.getElementById('modalSave').textContent='Simpan Pagu Baru';document.getElementById('modalSave').onclick=saveBudgetChange;
 refresh();document.getElementById('modal').classList.add('open');

function saveBudgetChange(){let x=db.find(z=>z.id===document.getElementById('budgetAccount').value);if(!x)return;let v=parseNominal(document.getElementById('newBudgetValue').value);if(v<Math.max(sum(x.actual),sum(x.plan))&&!confirm('Pagu Baru lebih kecil daripada total rencana atau realisasi yang sudah tercatat. Tetap simpan?'))return;x.budget=v;persist();closeModal();render();}

function filterRows(){let q=document.getElementById('q').value.toLowerCase(),level=document.getElementById('treeLevel')?.value||'all';document.getElementById('tbl').innerHTML=budgetTree(q,level)}
function saveStructure(){
 let z={bidang:document.getElementById('sBidang').value.trim(),program:document.getElementById('sProgram').value.trim(),kegiatan:document.getElementById('sKegiatan').value.trim(),subKegiatan:document.getElementById('sSub').value.trim(),aktivitas:document.getElementById('sAktivitas').value.trim()};
 if(!z.program||!z.kegiatan||!z.subKegiatan||!z.aktivitas){alert('Program, Kegiatan, Sub Kegiatan, dan Aktivitas wajib diisi.');return}
 let norm=v=>(v||'').trim().replace(/\s+/g,' ').toLocaleLowerCase('id');
 let found=structures.find(x=>norm(x.bidang)===norm(z.bidang)&&norm(x.program)===norm(z.program)&&norm(x.kegiatan)===norm(z.kegiatan)&&norm(x.subKegiatan)===norm(z.subKegiatan)&&norm(x.aktivitas)===norm(z.aktivitas));
 if(found){alert('Aktivitas dengan kombinasi Program, Kegiatan, dan Sub Kegiatan ini sudah tersimpan. Pilih aktivitas tersebut untuk menambahkan rekening.');return}
 structures.push({id:'STR'+Date.now(),...z});persistStructures();render();
}

function activityGroupKey(x){return String(x.structureId||[x.bidang,x.program,x.kegiatan,x.subKegiatan,x.aktivitas||x.activity].map(v=>String(v||'').trim().toLowerCase()).join('|'))}
function activityBreakdownGroups(){
 const map=new Map();
 db.forEach(x=>{

 });
 return [...map.values()].map(g=>{
  const amap=new Map();
  g.items.forEach(x=>{
   const ak=String(x.account||'').trim().toLowerCase().replace(/\s+/g,' ');
   if(!amap.has(ak))amap.set(ak,{key:ak,account:x.account||'',items:[],budget:0,plan:Array(12).fill(0)});
   const a=amap.get(ak);a.items.push(x);a.budget+=Number(x.budget||0);

 });

function setAccountBreakdown(activityKey,accountKey,month,value){
 const group=activityBreakdownGroups().find(g=>g.key===activityKey);if(!group)return;
 const account=group.accounts.find(a=>a.key===accountKey);if(!account)return;
 const amount=Math.max(0,Math.round(Number(value)||0));
 const weights=account.items.map(x=>Math.max(0,Number(x.budget)||0));
 const totalWeight=sum(weights);let assigned=0;
 account.items.forEach((x,i)=>{
  if(!Array.isArray(x.plan))x.plan=Array(12).fill(0);
  const part=i===account.items.length-1?amount-assigned:(totalWeight>0?Math.floor(amount*weights[i]/totalWeight):Math.floor(amount/account.items.length));
  x.plan[month]=part;assigned+=part;
 });
 persist();renderBD();
}
function breakdown(){return `<h1>Breakdown Anggaran Bulanan</h1><p class="desc">Breakdown ditampilkan per Aktivitas dan dirinci per Rekening Belanja. Rekening dengan kode dan uraian sama dalam Aktivitas yang sama digabung menjadi satu baris. Input bulanan dilakukan pada rekening, sedangkan baris Aktivitas menjadi ringkasan.</p><div class="panel"><div class="head"><span class="tag">Total pagu: ${money(total('budget'))}</span><span class="tag">Total rencana: ${money(total('plan'))}</span><button class="btn secondary" onclick="downloadBreakdownTemplate()">Template Impor</button><button class="btn secondary" onclick="document.getElementById('breakdownImportFile').click()">Impor Excel</button><input id="breakdownImportFile" type="file" accept=".xlsx,.xls" style="display:none" onchange="importBreakdownFile(this.files[0])"><select id="bm" onchange="renderBD()"><option value="-1">Tampilkan semua bulan</option>${months.map((m,i)=>`<option value="${i}">${m}</option>`).join('')}</select></div><div id="bdtable">${bdTable(-1)}</div></div>`}
function bdTable(m){

  const activityRow=`<tr class="breakdown-activity-row"><td><b>${esc(g.activity)}</b><div class="hint">${esc(g.subKegiatan||g.kegiatan||'')}</div></td><td class="num"><b>${money(g.budget)}</b></td>${monthIndexes.map(i=>`<td class="num">—</td>`).join('')}<td class="num"><b>${money(activityPlan)}</b></td><td class="num" style="font-weight:700;color:${activityDiff<0?'#dc2626':activityDiff===0?'#15803d':'#b45309'}">${money(activityDiff)}</td></tr>`;
  const rows=g.accounts.map(a=>{

   return `<tr class="breakdown-account-row"><td><span style="padding-left:18px;display:block">${esc(a.account)}</span><div class="hint" style="padding-left:18px">${a.items.length>1?a.items.length+' data rekening digabung':''}</div></td><td class="num">${money(a.budget)}</td>${monthIndexes.map(i=>`<td class="num"><input type="text" inputmode="numeric" class="money-input" value="${formatNominal(a.plan[i]||0)}" onchange="setAccountBreakdown('${g.key.replace(/'/g,"\\'")}','${a.key.replace(/'/g,"\\'")}',${i},parseNominal(this.value))"></td>`).join('')}<td class="num"><b>${money(planned)}</b></td><td class="num" style="font-weight:700;color:${diff<0?'#dc2626':diff===0?'#15803d':'#b45309'}">${money(diff)}</td></tr>`;
  }).join('');
  return activityRow+rows;
 }).join('');
 return `<div class="tablewrap"><table class="breakdown-global-table"><thead><tr><th>AKTIVITAS / REKENING BELANJA</th><th class="num">TOTAL PAGU</th>${monthIndexes.map(i=>`<th class="num month-heading">${months[i].slice(0,3)}</th>`).join('')}<th class="num">TOTAL BREAKDOWN</th><th class="num">SELISIH</th></tr></thead><tbody>${body}</tbody><tfoot><tr><th>TOTAL</th><th class="num">${money(totalBudget)}</th>${monthIndexes.map(i=>`<th class="num">${money(sum(groups.map(g=>g.plan[i]||0)))}</th>`).join('')}<th class="num">${money(totalPlan)}</th><th class="num">${money(totalBudget-totalPlan)}</th></tr></tfoot></table></div>`;
}

function semesterInfo(m){
 const start=m<6?0:6,end=start+5,monthsLeft=end-m+1;
 return {start,end,monthsLeft,name:m<6?'Semester I':'Semester II'};
}
function spjSemesterPool(x,m){
 const s=semesterInfo(m);
 const base=sum((x.plan||[]).slice(s.start,s.end+1));
 if(m<6)return base;
 const firstSemesterPlan=sum((x.plan||[]).slice(0,6));
 const firstSemesterActual=sum((x.actual||[]).slice(0,6));
 const carry=Math.max(0,firstSemesterPlan-firstSemesterActual);
 return base+carry;
}
function spjMonthlyPlan(x,m){
 // Rencana SPJ bulanan harus mengikuti nominal Breakdown pada bulan yang sama,
 // bukan membagi ulang sisa pagu semester dengan pembulatan.
 const planned=Number((x.plan||[])[m]||0);
 const realized=Number((x.actual||[])[m]||0);
 return Math.max(0,planned-realized);
}
function spjRemainingPool(x,m){
 const s=semesterInfo(m);
 return Math.max(0,spjSemesterPool(x,m)-sum((x.actual||[]).slice(s.start,m)));
}
function spjSemester1Remaining(x){
 return sum((x.plan||[]).slice(0,6))-sum((x.actual||[]).slice(0,6));
}
function spjSemester2Remaining(x){
 const base=sum((x.plan||[]).slice(6,12));
 const carry=Math.max(0,spjSemester1Remaining(x));
 return base+carry-sum((x.actual||[]).slice(6,12));
}
function spjYearRemaining(x){
 return (+x.budget||0)-sum(x.actual||[]);
}
function rencana(){return `<h1>Rencana SPJ Bulanan</h1><p class="desc">Nominal Rencana SPJ mengikuti nilai Breakdown Anggaran pada bulan yang dipilih. Sisa Semester II mencakup sisa Semester I yang masih tersedia, ditambah pagu Breakdown Semester II, dikurangi realisasi Semester II.</p><div class="panel"><div class="head"><div class="toolbar"><select id="rm" onchange="renderPlan()">${months.map((m,i)=>`<option value="${i}">${m}</option>`).join('')}</select></div><div class="toolbar"><button class="btn secondary" onclick="exportPlanExcel()">Ekspor Excel (.xlsx)</button></div></div><div id="plantable">${planTable(0)}</div></div><div class="note">Rencana SPJ merupakan rencana internal, bukan dokumen pertanggungjawaban. Dasar pagu semester berasal dari Breakdown Bulanan. Input realisasi pada menu Realisasi Anggaran akan otomatis mengubah sisa pagu dan pembagian rencana bulan berikutnya.</div>`}
function planGlobalGroups(m){
 const map=new Map();
 db.forEach(x=>{
  const key=String(x.account||'').trim().toLowerCase().replace(/\s+/g,' ');
  if(!map.has(key))map.set(key,{key,account:x.account||'',items:[],activities:[],amount:0,remaining:0,manual:false});
  const g=map.get(key);g.items.push(x);
  const a=x.aktivitas||x.activity||'';if(a&&!g.activities.includes(a))g.activities.push(a);
  if(!spjDeferredHas(x.id,m)){g.amount+=spjShownValue(x,m);g.remaining+=spjRemainingPool(x,m);if(spjManualValue(x.id,m)!==null)g.manual=true}
 });
 return [...map.values()].filter(g=>g.amount>0);
}
function deferSpjGlobal(key,m){
 const g=planGlobalGroups(m).find(z=>z.key===key);if(!g)return;
 if(!spjDeferred[m])spjDeferred[m]=[];
 g.items.forEach(x=>{if(!spjDeferred[m].includes(x.id))spjDeferred[m].push(x.id)});
 savePlanState();renderPlan();

function planTable(m){
 const s=semesterInfo(m);
 const allGroups=activityBreakdownGroups();
 const groups=allGroups.filter(g=>(g.plan[m]||0)>0 && !g.items.every(x=>spjDeferredHas(x.id,m)));
 const totalNow=sum(groups.map(g=>g.plan[m]||0));
 // Sisa semester I = pagu/breakdown semester I dikurangi realisasi aktual sampai bulan terpilih.
 // Pada semester II, sisa semester I yang positif dibawa ke pagu semester II.
 function remainingForActivity(g){
  const firstPlan=sum(g.items.map(x=>sum((x.plan||[]).slice(0,6))));
  const firstActual=sum(g.items.map(x=>sum((x.actual||[]).slice(0,6))));
  if(m<6){
   const actualToDate=sum(g.items.map(x=>sum((x.actual||[]).slice(0,m+1))));
   return firstPlan-actualToDate;
  }
  const secondPlan=sum(g.items.map(x=>sum((x.plan||[]).slice(6,12))));
  const secondActualToDate=sum(g.items.map(x=>sum((x.actual||[]).slice(6,m+1))));
  return Math.max(0,firstPlan-firstActual)+secondPlan-secondActualToDate;
 }
 const totalRemaining=sum(allGroups.map(remainingForActivity));
 return `<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin:5px 0 12px"><b>Rencana ${months[m]} ${activeYear} · ${s.name}</b><b>Total rencana bulan ini: ${money(totalNow)}</b></div>
 <div class="note" style="margin-bottom:12px"><b>Mekanisme:</b> Sisa Semester I dihitung dari pagu Breakdown Januari–Juni dikurangi realisasi sampai bulan terpilih. Pada Semester II, sisa Semester I yang masih tersedia ditambahkan ke pagu Breakdown Juli–Desember, kemudian dikurangi realisasi Semester II sampai bulan terpilih.</div>
 <div class="toolbar" style="justify-content:flex-end;margin-bottom:10px"><button class="btn" onclick="openManualSpj(${m})">＋ Tambah Manual</button></div>
 ${groups.length?`<div class="tablewrap"><table class="spj-plan-table breakdown-global-table"><thead><tr><th>AKTIVITAS</th><th class="num">${months[m].slice(0,3).toUpperCase()}</th><th class="num">SISA SEMESTER</th><th class="num">AKSI</th></tr></thead><tbody>${groups.map(g=>{
  const remaining=remainingForActivity(g);
  return `<tr><td><b>${esc(g.activity)}</b><div class="hint">${esc(g.subKegiatan||g.kegiatan||'')}</div></td><td class="num"><b>${money(g.plan[m]||0)}</b></td><td class="num" style="font-weight:700;color:${remaining<0?'#dc2626':'#15803d'}">${money(remaining)}</td><td class="num"><button class="spj-trash-btn" title="Tunda aktivitas bulan ini" onclick="deferActivitySpj('${g.key.replace(/'/g,"\\'")}',${m})">🗑</button></td></tr>`;
 }).join('')}</tbody><tfoot><tr><th>TOTAL</th><th class="num">${money(totalNow)}</th><th class="num">${money(totalRemaining)}</th><th></th></tr></tfoot></table></div>`:'<div style="padding:25px;text-align:center;color:#6b7890">Belum ada aktivitas dengan breakdown pada bulan ini. Gunakan tombol ＋ Tambah Manual atau periksa Breakdown Anggaran.</div>'}`;
}

 if(!spjDeferred[m])spjDeferred[m]=[];

function actualTable(){
 const root={children:new Map()};

 });

 [...root.children.values()].forEach(collectGroups);

 }).join('');
 const renderNode=n=>{
  const descendants=[];const gather=z=>{if(z.level===3)descendants.push(...[...z.accounts.values()].flatMap(g=>g.items));else [...z.children.values()].forEach(gather)};gather(n);
  const pure=agg(descendants,x=>x.originalBudget??x.budget),budget=agg(descendants,x=>x.budget);

  if(n.level===3){
   row+=[...n.accounts.values()].map(g=>{

function setAccountActual(encodedScope,m,value){
 const scope=JSON.parse(decodeURIComponent(encodedScope));
 const norm=v=>String(v??'').trim().replace(/\s+/g,' ').toLowerCase();
 const matches=db.filter(x=>[x.program||'Tanpa Program',x.kegiatan||'Tanpa Kegiatan',x.subKegiatan||'Tanpa Sub Kegiatan',x.aktivitas||x.activity||'Tanpa Aktivitas',x.account||'Tanpa Rekening'].map(norm).join('|')===scope.map(norm).join('|'));
 if(!matches.length)return;
 const amount=Math.max(0,Math.round(Number(value)||0));
 const weights=matches.map(x=>Math.max(0,Number((x.plan||[])[m])||0));
 let totalWeight=sum(weights);
 if(totalWeight<=0){weights.splice(0,weights.length,...matches.map(()=>1));totalWeight=matches.length}
 let assigned=0;
 matches.forEach((x,i)=>{
  if(!Array.isArray(x.actual))x.actual=Array(12).fill(0);
  const part=i===matches.length-1?amount-assigned:Math.floor(amount*weights[i]/totalWeight);
  x.actual[m]=part;assigned+=part;
 });
 persist();
 if(page==='realisasi')renderActual();
 if(page==='dashboard'||page==='laporan')render();
}

}

function exportActualDetailExcel(){

   let node=roots;
   levels(x).forEach((label,idx)=>{
    const key=norm(label);
    if(!node.has(key))node.set(key,{label,level:idx,children:new Map(),accounts:new Map(),items:[]});

   });
    let n=roots;
   levels(x).forEach(label=>n=n.get(norm(label)).children);
   const accountKey=norm(x.account||'Tanpa Rekening');
   if(!n.has(accountKey))n.set(accountKey,{label:x.account||'Tanpa Rekening',level:4,items:[]});

  });

  const border={top:{style:'thin',color:{rgb:'CBD5E1'}},bottom:{style:'thin',color:{rgb:'CBD5E1'}},left:{style:'thin',color:{rgb:'CBD5E1'}},right:{style:'thin',color:{rgb:'CBD5E1'}}};

  for(let r=3;r<rows.length;r++){

   for(let c=0;c<headers.length;c++){

    cell.s={border,alignment:{vertical:'center',wrapText:c===0||c>=headers.length-12,horizontal:c===0||c>=headers.length-12?'left':'right'},...(c>0&&c<headers.length-12?{numFmt:'#,##0'}:{})};
    if(isTotal)cell.s={...cell.s,font:{bold:true},fill:{fgColor:{rgb:'E2E8F0'}}};
    else if(c===0){const depth=(String(rows[r][0]).match(/^　*/)||[''])[0].length;cell.s={...cell.s,font:{bold:depth<=2},fill:{fgColor:{rgb:depth===0?'DCE8F5':depth===1?'EAF1FA':depth===2?'F2F6FB':'FFFFFF'}}};}
   }
  }
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:headers.length-1}},{s:{r:1,c:0},e:{r:1,c:headers.length-1}}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Realisasi Rinci');

 }catch(err){console.error('Ekspor Excel Rinci gagal:',err);alert('Ekspor Excel Rinci gagal: '+(err&&err.message?err.message:String(err)));}

function excelImportRows(file){

  try{

   const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:false});
   const norm=v=>String(v??'').toLowerCase().replace(/[\s_\-\/]+/g,'').replace(/[^a-z0-9]/g,'');
   let sheet=wb.SheetNames.find(n=>norm(n)==='dataimpor');
   if(!sheet)sheet=wb.SheetNames.find(n=>{
    const a=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''});
    const hs=(a[0]||[]).map(norm);
    return hs.includes('aktivitas')||hs.includes('rekeningbelanja')||hs.includes('rekening');
   });
   if(!sheet)throw new Error('Sheet DATA IMPOR tidak ditemukan.');
   const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheet],{header:1,defval:'',raw:true,blankrows:false});
   if(rows.length<2)throw new Error('Sheet DATA IMPOR belum berisi data.');
   resolve(rows);
  }catch(e){reject(e)}
 });
}

async function importActualFile(file){
 if(!file)return;
 importStatus(true,'Membaca file realisasi...',10,file.name);
 try{
  const rows=await excelImportRows(file),c=importHeaderMap(rows);
  if(c.account<0||c.months.some(i=>i<0))throw new Error('Kolom Rekening Belanja dan 12 kolom bulan (Januari–Desember) wajib tersedia. Gunakan Template Impor Realisasi.');
  const norm=v=>String(v??'').replace(/\u00a0/g,' ').trim().replace(/\s+/g,' ').toLowerCase();
  const path=x=>[x.program||'Tanpa Program',x.kegiatan||'Tanpa Kegiatan',x.subKegiatan||'Tanpa Sub Kegiatan',x.aktivitas||x.activity||'Tanpa Aktivitas',x.account||'Tanpa Rekening'].map(norm).join('|');
  const map=new Map();
  db.forEach(x=>{const k=path(x);if(!map.has(k))map.set(k,[]);map.get(k).push(x)});
  let updated=0,unmatched=0,invalid=0,hierarchySkipped=0,totalSkipped=0,groupedUpdated=0;
  const unmatchedDetails=[];
  for(let ri=1;ri<rows.length;ri++){
   const r=rows[ri];
   if(!r||!r.some(v=>String(v??'').trim()!==''))continue;
   const rowType=c.rowtype>=0?norm(r[c.rowtype]):'account';
   if(rowType==='hierarchy'){hierarchySkipped++;continue}
   if(rowType==='total'){totalSkipped++;continue}
   if(rowType&&rowType!=='account'){unmatched++;continue}
   const k=[c.program,c.kegiatan,c.sub,c.aktivitas,c.account].map((i,j)=>norm(i<0?(['Tanpa Program','Tanpa Kegiatan','Tanpa Sub Kegiatan','Tanpa Aktivitas','Tanpa Rekening'][j]):r[i])).join('|');
   const matches=map.get(k);
   if(!matches||!matches.length){
    unmatched++;
    if(unmatchedDetails.length<8)unmatchedDetails.push(String(r[c.account]||r[0]||'Rekening tanpa nama'));
    continue;
   }
   const vals=c.months.map(i=>typeof r[i]==='number'?r[i]:parseNominal(r[i]));
   if(vals.some(v=>!Number.isFinite(v)||v<0)){invalid++;continue}
   vals.forEach((v,m)=>{
    const weights=matches.map(x=>Math.max(0,Number((x.plan||[])[m])||0));
    let tw=sum(weights);
    if(tw<=0){weights.splice(0,weights.length,...matches.map(()=>1));tw=matches.length}
    let assigned=0;
    matches.forEach((x,j)=>{
     if(!Array.isArray(x.actual))x.actual=Array(12).fill(0);
     const part=j===matches.length-1?v-assigned:Math.floor(v*weights[j]/tw);
     x.actual[m]=part;
     assigned+=part;
    });
   });
   if(matches.length>1)groupedUpdated++;
   updated++;
   if(ri%10===0)importStatus(true,'Memproses realisasi...',20+Math.round(ri/rows.length*70),'Baris '+ri+' dari '+rows.length);
  }
  if(!updated)throw new Error('Tidak ada rekening yang berhasil diperbarui. Periksa kesesuaian identitas rekening dengan Data Anggaran.');
  persist();
  render();
  const detail=updated+' rekening diperbarui'+(groupedUpdated?', termasuk '+groupedUpdated+' rekening gabungan yang dibagikan ke beberapa data barang':'')+'. '+hierarchySkipped+' baris hierarki dan '+totalSkipped+' baris total dilewati sebagaimana mestinya. '+unmatched+' rekening tidak ditemukan; '+invalid+' baris nominal tidak valid.';
  importStatus(true,'Impor realisasi berhasil',100,detail);
  if(unmatchedDetails.length)console.warn('Rekening yang tidak ditemukan saat impor:',unmatchedDetails);
  setTimeout(()=>importStatus(false),3500);
 }catch(e){
  importStatus(false);
  alert('Impor realisasi gagal: '+e.message);
 }

 if(input)input.value='';
}

   const first=text.split(/\r?\n/,1)[0];
   const delimiter=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';

    const ch=text[i],next=text[i+1];

     if(ch==='\r'&&next==='\n')i++;
     current.push(cell);if(current.some(v=>String(v).trim()!==''))out.push(current);
     current=[];cell='';

  const targetYear=Number(payload.year);
  const importedDatabaseId=/^DB\d{6}$/.test(String(payload.databaseId||''))?String(payload.databaseId).toUpperCase():makeDatabaseId(payload.exportedAt?new Date(payload.exportedAt):new Date());
  if(!confirm('Impor database '+importedDatabaseId+' Tahun Anggaran '+targetYear+'?\\n\\nData lokal untuk tahun tersebut akan DIGANTI dengan isi file. Data tahun lain tidak diubah. Pastikan Anda sudah mengekspor/cadangkan database lokal terlebih dahulu.'))return;
  const normalized=payload.data.map(x=>{
   if(!x||typeof x!=='object'||!x.account)throw new Error('Ada baris rekening yang tidak valid pada file database.');
   const item={...x};
   if(!Array.isArray(item.plan))item.plan=Array(12).fill(0);
   if(!Array.isArray(item.actual))item.actual=Array(12).fill(0);
   if(!Array.isArray(item.actualNotes))item.actualNotes=Array(12).fill('');
   if(!item.components)item.components={};
   if(item.originalBudget==null)item.originalBudget=Number(item.budget)||0;
   if(item.budget==null)item.budget=Number(item.originalBudget)||0;
   return item;
  });
  const spj=payload.spj&&typeof payload.spj==='object'?payload.spj:{};
  localStorage.setItem('simAnggaranData_'+targetYear,JSON.stringify(normalized));
  if(targetYear===2026)localStorage.setItem('simKontrolAnggaran2026_v8',JSON.stringify(normalized));
  localStorage.setItem('simKontrolAnggaran2026_v9_structures',JSON.stringify(payload.structures));
  localStorage.setItem('simSPJ_deferred_'+targetYear,JSON.stringify(spj.deferred||{}));
  localStorage.setItem('simSPJ_manual_'+targetYear,JSON.stringify(spj.manual||{}));
  localStorage.setItem('simAnggaranDatabaseId_'+targetYear,importedDatabaseId);
  activeYear=targetYear;
  localStorage.setItem('simAnggaranActiveYear',String(targetYear));
  db=normalized;
  structures=payload.structures;
  spjDeferred=spj.deferred||{};
  spjManual=spj.manual||{};
  const sel=document.getElementById('yearSelect');if(sel)sel.value=String(targetYear);
  render();
  updateDatabaseBadge();
  alert('Impor database '+importedDatabaseId+' berhasil. '+normalized.length+' rekening dan seluruh data rencana SPJ telah dimuat untuk Tahun Anggaran '+targetYear+'.');
 }catch(e){alert('Impor database gagal: '+(e&&e.message?e.message:String(e)))}
 const input=document.getElementById('databaseImportFile');if(input)input.value='';
}

function backup(){dl('backup-anggaran-'+activeYear+'.json',JSON.stringify(db,null,2),'application/json')}
document.getElementById('yearSelect').value=String(activeYear);updateAppName();render();updateDatabaseBadge();
</script></body></html>
